# CI — lint, test, audit, cross-OS matrix
#
# What runs on every push + pull request (main and dev — development happens
# on dev, so breakage must surface before the PR to main opens):
#   1. backend   (ubuntu/windows/macos × Python 3.11/3.13): install, compile,
#      import smoke, offline pytest suite (no Firebase credentials needed)
#   2. frontend  (ubuntu/windows/macos × Node 20): npm ci, eslint (required),
#      tsc + vite build, advisory npm audit (see the step comment)
#   3. audit     (ubuntu): pip-audit over the installed backend environment
#      (required — fails on any known vulnerability in app dependencies)
#   4. docs-health (ubuntu): required community-health files present, no secrets staged
#
# Branch protection should require: backend, frontend, audit, docs-health.
#
# There is no Postgres service and no legacy SQL suite any more: Firebase is
# the only system of record (ADR-005).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- backend --
  backend:
    name: backend / py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check (all app modules)
        run: python -m compileall -q app

      - name: Import smoke (no credentials needed)
        run: python -c "import app.main; print('app.main imports OK:', app.main.app.title)"

      # Offline suite: forces empty Firebase config, so it asserts boot,
      # the mounted API contract, and the pure-Python services (RBAC catalog,
      # stub drafts, DOCX rendering, blob compression). It never reaches Auth
      # or Firestore.
      - name: Offline test suite
        run: python -m pytest

      - name: Dependency consistency
        run: pip check

  # --------------------------------------------------------------- frontend --
  frontend:
    name: frontend / node20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint is configured (eslint.config.js) and the suite passes clean,
      # so lint is a required gate like the build.
      - name: Lint
        run: npm run lint

      # Vite inlines VITE_* at build time; empty values are fine because
      # src/lib/firebase.ts reports a configuration error at runtime instead
      # of failing the build.
      - name: Type-check + build
        run: npm run build

      # Advisory on purpose (reviewed 2026-11, re-check 2027-02): the 4 high
      # findings are transitive (@grpc/grpc-js via the firebase v13 line;
      # the registry's fix is a firebase 9.14 downgrade — wrong direction)
      # and unreachable from our usage (browser SDK, no server-side gRPC
      # auth). Fixing them needs firebase/react-router majors, tracked
      # separately from this gate.
      - name: Dependency audit (advisory — see comment)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload dist artifact (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------------------- audit --
  audit:
    name: audit / pip-audit on ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      # Required gate: fails on any known vulnerability in the installed
      # app dependencies. pip/setuptools are upgraded first so installer
      # tooling is never what trips it.
      - name: Audit installed dependencies
        run: python -m pip_audit --desc

  # ------------------------------------------------------------ docs-health --
  docs-health:
    name: docs-health / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required community-health files present
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md ACCESSIBILITY.md SUPPORT.md CHANGELOG.md .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS .github/dependabot.yml; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          test -f docs/GETTING_STARTED.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API_OVERVIEW.md
          test -f docs/DEVELOPMENT.md
          test -f docs/DOCKER.md
          test -f docs/decisions/ADR-005-firestore-only-runtime.md
          test -f docs/decisions/ADR-006-firestore-document-storage.md
          echo "All required docs present."

      - name: No stale SQL/Postgres references in the shipped code
        run: |
          # Markdown is excluded on purpose: the ADRs and CHANGELOG document the
          # history of the migration (ADR-001 → ADR-005) and must be able to
          # name Postgres/SQLAlchemy.
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=ref-repos \
               --exclude-dir=dist --include='*.py' --include='*.txt' --include='*.toml' \
               --include='*.ini' --include='*.yml' --include='*.yaml' --include='Dockerfile' \
               -E 'sqlalchemy|asyncpg|alembic|DATABASE_URL|psycopg' .; then
            echo "ERROR: legacy SQL references found — see ADR-005."; exit 1
          fi
          echo "No legacy SQL references found."

      - name: No secrets or env files staged
        run: |
          git status --short | tee /tmp/status.txt
          if grep -Eq '(\.env$|secrets/|firebase-service-account\.json|\.pem$|\.key$)' /tmp/status.txt; then
            echo "ERROR: secret-looking files in working tree — see SECURITY.md."; exit 1;
          fi
          echo "No secret-looking files found."
