# Local full-stack stack: the real production image plus the built frontend.
#
# Not how the project is deployed — that is a single container on a PaaS
# (see DEPLOYMENT.md). This file exists so a contributor can exercise the
# gunicorn-served image and the Firebase-configured UI together instead of
# only `uvicorn --reload` + `npm run dev`.
#
# Firebase (Auth and Firestore, which also stores the documents) is external:
# point backend/.env at a Firebase project (or the Emulator Suite) before
# starting. There is no database container and no bucket any more — Firestore
# is the only system of record.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # The host port is configurable because 8000 is a popular local port
    # (and `frontend/.env` → VITE_API_URL must match whatever you pick).
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status in (200, 503) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # /health returns 503 until Firebase credentials resolve (by design:
      # the probe is unretried and the app stays usable for setup), so both
      # codes count as "up" — only a connection failure or a 500 fails it.
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines VITE_* at build time, so these must be build args, not
        # runtime environment variables.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
